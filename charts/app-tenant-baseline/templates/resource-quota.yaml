apiVersion: v1
kind: ResourceQuota
metadata:
  name: "{{ .Release.Name }}-quota"
  namespace: "{{ .Values.namespace  }}"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hard:
    requests.cpu: "{{ .Values.governance.quota.requestsCpu  }}"
    requests.memory: "{{ .Values.governance.quota.requestsMemory  }}"
    limits.cpu: "{{ .Values.governance.quota.limitsCpu  }}"
    limits.memory: "{{ .Values.governance.quota.limitsMemory  }}"

    # Límites de objetos para evitar saturación de etcd
    pods: "10"                   # Máximo 10 pods simultáneos
    services: "5"
    persistentvolumeclaims: "3"  # Máximo 3 PVCs (ej. S3 / EBS)
    services.loadbalancers: "0"  # Prohibido crear NLBs directos en dev (se usa Ingress compartido)
