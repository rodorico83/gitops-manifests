apiVersion: v1
kind: Service
metadata:
  name: servicio-a-frontend
  namespace: test-mesh
spec:
  ports:
    - name: http-frontend # 👈 Prefijo para que Istio y Kiali midan métricas HTTP
      port: 80
      targetPort: 80
  selector:
    app: frontend-app
---
# 4. SERVICIO B (BACKEND SERVER con retraso simulado)
apiVersion: v1
kind: Service
metadata:
  name: servicio-b-backend
  namespace: test-mesh
spec:
  ports:
    - name: http-backend # 👈 Prefijo obligatorio
      port: 80
      targetPort: 80
  selector:
    app: backend-app