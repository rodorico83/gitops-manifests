apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-tester
  namespace: redis-tester
  labels:
    app: redis-tester
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: redis-tester
  template:
    metadata:
      labels:
        app: redis-tester
        app.kubernetes.io/name: redis-tester
      annotations:
        secret.reloader.stakater.com/reload: "redis-secret-k8s"
    spec:
      serviceAccountName: "redis-tester-sa"
      nodeSelector:
        karpenter.sh/nodepool: "low-cost-pool"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-worker
          image: python:3.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              export TMPDIR=/tmp
              export PIP_CACHE_DIR=/tmp/.cache
              pip install --no-cache-dir --target=/tmp/deps redis
              export PYTHONPATH=/tmp/deps:$PYTHONPATH

              cat << 'EOF' > /tmp/worker.py
              import os, sys, time, redis
              from redis.sentinel import Sentinel
              sys.path.insert(0, '/tmp/deps')

              SENTINEL_HOST = os.environ.get('REDIS_HOST', 'redis-cluster.redis.svc.cluster.local')
              SENTINEL_PORT = int(os.environ.get('REDIS_PORT', 26379))
              REDIS_PASSWORD = os.environ.get('REDIS_PASSWORD', '')
              MASTER_NAME = "mymaster"

              print("[*] Conectando a Redis Sentinel para descubrir el maestro...", flush=True)

              client = None
              while not client:
                  try:
                      # Sentinel se conecta sin password (los pods de sentinel no lo piden)
                      sentinel = Sentinel([(SENTINEL_HOST, SENTINEL_PORT)], socket_timeout=3)
                      master_address = sentinel.discover_master(MASTER_NAME)
                      print(f"[+] Maestro descubierto en {master_address}", flush=True)

                      # El password se aplica aquí para autenticarnos contra el Redis Maestro real
                      client = sentinel.master_for(MASTER_NAME, password=REDIS_PASSWORD, socket_timeout=3, decode_responses=True)
                      client.ping()
                      print("[+] Conectado exitosamente al nodo maestro de Redis.", flush=True)
                  except Exception as e:
                      print(f"[-] Esperando al maestro a través de Sentinel: {e}", flush=True)
                      client = None
                      time.sleep(5)

              while True:
                  try:
                      client.set("k8s:worker:status", "Activo y operativo", ex=30)
                      visitas = client.incr("k8s:worker:contador")
                      val = client.get("k8s:worker:status")
                      print(f"[>] Redis OK | Estado: {val} | Ciclo de escritura nº: {visitas}", flush=True)
                  except Exception as e:
                      print(f"[!] Error durante la operación con el maestro de Redis: {e}", flush=True)
                      client = None
                      break

                  time.sleep(10)
              EOF

              cd /tmp
              python worker.py
          env:
            - name: REDIS_HOST
              value: "redis-cluster.redis.svc.cluster.local"
            - name: REDIS_PORT
              value: "26379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret-k8s
                  key: redis-password
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
      volumes:
        - name: tmp-storage
          emptyDir: {}