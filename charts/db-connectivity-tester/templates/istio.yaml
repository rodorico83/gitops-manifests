{{- if .Values.istio.enabled }}

# Inyección Automática del Proxy Envoy
#  Para que los microservicios formen parte de la malla sin modificar su código, se añade una etiqueta al namespace de la aplicación:
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace | quote }}
  labels:
    istio-injection: enabled # Inyecta automáticamente el contenedor sidecar de Envoy en cada Pod
---

# En lugar de un recurso Ingress, el Helm chart de la aplicación define el enrutamiento:
# Enrutamiento y Traffic Shifting (Canary 90% a v1 y 10% a v2)
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.namespace | quote }}
  namespace: dev
spec:
  hosts:
    - "payment-service"
  http:
    - route:
        - destination:
            host: payment-service
            subset: v1
          weight: 90
        - destination:
            host: payment-service
            subset: v2
          weight: 10
      timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 1s
---

# Definición de versiones y Circuit Breaker
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payment-service
  namespace: dev
spec:
  host: payment-service
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # mTLS automático
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    outlierDetection: # Circuit Breaking si un pod falla
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
---

# Para impedir que cualquier servicio hable con otro sin permiso explícito
# Bloquear todo el tráfico no autorizado en el namespace
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-only-frontend-to-payment
  namespace: dev
spec:
  selector:
    matchLabels:
      app: payment-service
  action: ALLOW
  rules:
    - from:
        - source:
            # Solo permite llamadas si provienen de la identidad criptográfica (SPIFFE) de frontend
            principals: ["cluster.local/ns/dev/sa/frontend-service-sa"]
      to:
        - operation:
            methods: ["POST"]
            paths: ["/api/v1/charge"]


{{- end }}