apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | quote }}
  namespace:  {{ .Values.namespace | quote }}
  annotations:
    # Inyección dinámica del rol IAM para que este Pod específico tenga acceso a S3
    eks.amazonaws.com/role-arn: {{ .Values.s3Storage.roleArn | quote }}
# Evita que el token de K8s se inyecte en texto plano dentro del pod
automountServiceAccountToken: false