apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default "mi-app-backend-service" | quote }}
  namespace: default
spec:
  type: {{ .Values.service.type | default "ClusterIP" | quote }}
  selector:
    app: db-tester
  ports:
    - protocol: TCP
      port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
