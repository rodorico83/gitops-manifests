{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.namespace | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1 #argoproj.io/v1alpha1
    kind: Deployment #Rollout
    name: {{ .Values.namespace | quote }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}

  # ---------- CONFIGURACIÓN DEL BEHAVIOR ----------
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # Espera ventana de tiempo antes de proceder al desescalado
      policies:
      - type: Percent
        value: 100          # Siempre redondea hacia arriba por lo que 10% de 1 pod es un pod
        periodSeconds: 60
      selectPolicy: Max

    # Escalado agresivo
    scaleUp:
      stabilizationWindowSeconds: 30 # Reacciona INMEDIATAMENTE al pico de tráfico (0 default)
      policies:
        - type: Percent
          value: 100 #200         # aumento un 100% el numero de replicas
          periodSeconds: 30       #  cada 15 segundos si es necesario.
        #- type: Pods
        #  value: 4           # O añade un mínimo de 4 Pods fijos si el porcentaje da menos.
        #  periodSeconds: 15
      selectPolicy: Max    # Elige la política que cree MÁS Pods para estar seguros.
{{- end }}