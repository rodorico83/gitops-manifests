apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials-sync
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-k8s-secret             # Nombre del Secret nativo de K8s que creará ESO
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "{{ .Values.secretsManager.objectName }}" # Tu ARN o nombre del secreto en AWS