apiVersion: argoproj.io/v1alpha1 #apps/v1
kind: Rollout #Deployment
metadata:
  name: {{ .Values.namespace | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app: db-tester
  annotations:
    argocd.argoproj.io/sync-wave: "2" # <-- Se ejecuta despues del tenant-baseline
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: db-tester
  template:
    metadata:
      labels:
        app: db-tester
        app.kubernetes.io/name : {{ .Values.namespace | quote }}
        #role: backend-app
      annotations:
        secret.reloader.stakater.com/reload: "db-k8s-secret"
        #reloader.stakater.com/auto: "true" to cover all secrets in deployment
        # For Opentelemery init container to inject libraries
        instrumentation.opentelemetry.io/inject-python: "monitoring/autoinstrumentation"

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}


      nodeSelector:
        karpenter.sh/nodepool: "low-cost-pool"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway # Intentará mantener maxSkew=1, pero si una AZ no tiene espacio, desplegará en otra antes que bloquear el pod (other option DoNotSchedule)
          labelSelector:
            matchLabels:
              app: db-tester

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault            # 👈 Muy recomendado por Wiz

      initContainers:
        - name: check-credentials
          image: busybox:1.36
          env:
            - name: host
              valueFrom:
                configMapKeyRef:
                  name: database-network-metadata
                  key: DB_ENDPOINT
            - name: password
              valueFrom:
                secretKeyRef:
                  name: db-k8s-secret
                  key: password
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              if [ -z "$host" ] || [ -z "$password" ]; then
                echo "ERROR: Faltan credenciales críticas"
                exit 1
              fi
              echo "Credenciales validadas correctamente."

      containers:
        - name: web-validator
          image: python:3.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # We mount empty volume otherwise python scprit will fail writing on /tmp
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp



          command: [ "/bin/sh", "-c" ]
          args:
            - |
              # Forzar a pip a realizar sus descargas y caché en el /tmp escribible
              export TMPDIR=/tmp
              export PIP_CACHE_DIR=/tmp/.cache

              # 1. Instalar el driver de Postgres y Flask en memoria
              pip install --no-cache-dir --target=/tmp/deps flask psycopg2-binary
              export PYTHONPATH=/tmp/deps:$PYTHONPATH

              # 2. Escribir el script del servidor web interactivo
              cat << 'EOF' > /tmp/app.py
              import os, sys, subprocess
              sys.path.insert(0, '/tmp/deps') # Garantiza que Python encuentre el módulo
              import psycopg2
              from flask import Flask
              app = Flask(__name__)

              # Endpoint ligero para Startup y Liveness Probes
              @app.route('/healthz')
              def healthz():
                  return "OK", 200

              @app.route('/')
              def check_db():
                  db_host = os.environ.get('host')
                  db_port = os.environ.get('port', '5432')
                  db_user = os.environ.get('username')
                  db_pass = os.environ.get('password')

                  try:
                      # Intento directo de conexión con psycopg2
                      conn = psycopg2.connect(
                          host=db_host,
                          port=db_port,
                          user=db_user,
                          password=db_pass,
                          dbname="example_dev",
                          connect_timeout=3
                      )
                      conn.close()
                      return f"""
                      <div style='text-align:center; margin-top:10%; font-family:Arial, sans-serif;'>
                          <h1 style='color:#2ecc71;'>✅ [ÉXITO] Conexión Híbrida Establecida</h1>
                          <p style='font-size:18px;'>El Pod con SG dedicado ha alcanzado la base de datos de AWS de forma segura.</p>
                          <p style='color:#7f8c8d;'>Endpoint: {db_host} | Puerto: {db_port}</p>
                      </div>
                      """
                  except Exception as e:
                      error_msg = str(e)
                      print(f"Error en conexion: {error_msg}", flush=True)
                      return f"""
                      <div style='text-align:center; margin-top:10%; font-family:Arial, sans-serif;'>
                          <h1 style='color:#e74c3c;'>❌ [FALLO] Conexión Interrumpida</h1>
                          <p style='font-size:18px; color:#c0392b;'>Tiempo de espera agotado o error de autenticación.</p>
                          <p style='color:#7f8c8d;'>Endpoint: {db_host} | Puerto: {db_port} | User {db_user} </p>
                          <p style='color:#95a5a6; font-size:12px;'>Detalle: {str(e)}</p>
                      </div>
                      """, 503

              if __name__ == '__main__':
                  app.run(host='0.0.0.0', port=8080)
              EOF

              # 3. Arrancar el servidor web
              echo "Iniciando validador web en el puerto 8080..."
              cd /tmp
              python app.py
          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20  # Espera 5s iniciales para que pip empiece a descargar
            periodSeconds: 10        # Evalúa cada 5s
            failureThreshold: 5    # 24 intentos * 5s = 120s (2 min) de tolerancia máxima para el 'pip install'
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10       # Revisa cada 10s si el proceso Flask sigue vivo
            timeoutSeconds: 2       # Si tarda más de 2s en responder el ping, cuenta como fallo
            failureThreshold: 3     # Si falla 3 veces seguidas, reinicia el Pod

          readinessProbe:
            httpGet:
              path: /                 # Golpea la raíz para forzar el test de conexión a la Base de Datos
              port: 8080
            periodSeconds: 15       # Monitorea la salud de la red/DB cada 15s
            timeoutSeconds: 4       # Margen ligeramente superior al connect_timeout de psycopg2 (3s)              failureThreshold: 2     # Remueve el tráfico rápido si la conexión falla continuamente
            successThreshold: 1

          resources:
            requests:
              cpu: "100m"     # 👈 HPA looks at this to calculate the 70% or 80% threshold
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: host
              valueFrom:
                configMapKeyRef:
                  name: database-network-metadata
                  key: DB_ENDPOINT
            - name: port
              valueFrom:
                configMapKeyRef:
                  name: database-network-metadata
                  key: DB_PORT
            - name: username
              valueFrom:
                secretKeyRef:
                  name: db-k8s-secret
                  key: username
            - name: password
              valueFrom:
                secretKeyRef:
                  name: db-k8s-secret
                  key: password
          #volumeMounts:
            #- name: secrets-store-inline
              #mountPath: "/mnt/secrets-store"
              #readOnly: true
      volumes:
        - name: tmp-storage
          emptyDir: { }
        #- name: secrets-store-inline
          #csi:
            #driver: "secrets-store.csi.k8s.io"
            #readOnly: true
            #volumeAttributes:
              #secretProviderClass: "aws-db-secrets-provider"

          #volumeMounts:
            #- name: s3-volume
              #mountPath: {{ .Values.s3Storage.mountPath }}
      #volumes:
        #- name: s3-volume
          #persistentVolumeClaim:
            #claimName: {{ .Release.Name }}-s3-pvc

  strategy:
    #type: RollingUpdate
    #rollingUpdate:
    #  maxSurge: 1          # Cuántos Pods extra se pueden crear en el proceso
    #  maxUnavailable: 0    # 👈 O 50%, justo aquí
    canary:
      canaryService: "{{ .Values.service.name }}-canary"
      stableService: {{ .Values.service.name | quote }}
      # --- CONFIGURACIÓN DE TRAFFIC ROUTING CON NGINX ---
      analysis:
        templates:
          - templateName: success-rate-check
        args:
          - name: service-name
            value: "{{ .Values.service.name }}-canary" #my-app-canary
      trafficRouting:
        nginx:
          stableIngress: {{ .Values.namespace | quote }}  # Argo modificará automáticamente este Ingress
      steps:
        - setWeight: 5
        - pause: { duration: 1m }
        #- setWeight: 20
        #- pause: { duration: 1m }
        #- setWeight: 50
        #- pause: { duration: 1m }

  #blueGreen:
    # Servicio que recibe el tráfico de Producción/Real
    #activeService: {{ .Values.service.name | quote }}
    # Servicio para probar la nueva versión antes de promoverla
    #previewService: "{{ .Values.service.name }}-preview"
    # Auto-promoción: si pones 'false', requerirá 'kubectl argo rollouts promote'
    #autoPromotionEnabled: true
    # Mantiene la versión antigua viva durante X segundos tras la promoción para hacer rollback instantáneo si es necesario
    #scaleDownDelaySeconds: 30
    # Pre-promotion Analysis: Ejecuta el test de Prometheus sobre el preview BEFORE de cambiar el tráfico real
    #prePromotionAnalysis:
      #templates:
        #- templateName: success-rate-check
      #args:
        #- name: service-name
          #value: "{{ .Values.service.name }}-preview"