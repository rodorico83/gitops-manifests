# Configuración de réplicas
replicaCount: 1

# Servicio interno de Kubernetes
service:
  name: mi-app-backend-service
  type: ClusterIP
  port: 80
  targetPort: 8080

# Exposición con Ingress NGINX y Cert-Manager
ingress:
  enabled: true
  className: nginx
  host: aws.rj-engineering.com
  clusterIssuer: letsencrypt-production
  tlsSecretName: db-tester-tls-cert

# Cuenta de servicio IAM (IRSA) para AWS Secrets Manager
serviceAccount:
  name: aws-secrets-manager-sa

# Nombre o ARN del secreto en AWS Secrets Manager
secretsManager:
  objectName: ""

# Metadatos de red para conexión a la Base de Datos
configMapData:
  DATABASE_ENDPOINT: "database.xyz.eu-west-1.rds.amazonaws.com"
  DATABASE_PORT: "5432"

# Inyección segura de credenciales mapeadas por Secrets Store CSI
envFromSecrets:
  - name: DATABASE_USER
    secretKeyRef:
      name: db-k8s-secret
      key: username
  - name: DATABASE_PASSWORD
    secretKeyRef:
      name: db-k8s-secret
      key: password
