# Configuración de réplicas
replicaCount: 1

istio:
  enabled : false

secret_provider:
  enabled: false

# Exposición con Ingress NGINX y Cert-Manager
ingress:
  enabled: true
  className: nginx
  host: db-tester.aws.rj-engineering.com
  clusterIssuer: letsencrypt-dev
  tlsSecretName: db-tester-tls-cert

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80  # Scales up faster (at 70% CPU load)
  targetMemoryUtilizationPercentage: 80

karpenter:
  capacityTypes: ["on_demand"] # Prod requires stable, non-interruptible instances
  maxCpuLimit: 2000            # High safety cap to handle massive traffic surges

app-tenant-baseline:
  repoUrl: "https://github.com/rodorico83/gitops-manifests.git"
  repoPath: "charts/db-connectivity-tester"
  serviceAccount: "db-connectivity-tester"
  # Guardrails values
  governance:
    enabled: true
    quota:
      requestsCpu: "1000m"
      requestsMemory: "1Gi"
      limitsCpu: "2000m"
      limitsMemory: "2Gi"
      pods: 10
    limitRange:
      defaultLimitCpu: "500m"
      defaultLimitMemory: "256Mi"
      defaultRequestCpu: "100m"
      defaultRequestMemory: "128Mi"