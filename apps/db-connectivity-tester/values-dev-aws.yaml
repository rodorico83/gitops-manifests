# Configuración de réplicas
replicaCount: 1

# Exposición con Ingress NGINX y Cert-Manager
ingress:
  enabled: true
  className: nginx
  host: db-tester.aws.rj-engineering.com
  clusterIssuer: letsencrypt-dev
  tlsSecretName: db-tester-tls-cert

# Cuenta de servicio IAM (IRSA) para AWS Secrets Manager
serviceAccount:
  name: aws-secrets-manager-sa

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70  # Scales up faster (at 70% CPU load)

karpenter:
  capacityTypes: ["on_demand"] # Prod requires stable, non-interruptible instances
  maxCpuLimit: 2000            # High safety cap to handle massive traffic surges
