# Configuración de réplicas
replicaCount: 1

namespace: dev
environment: dev

# Servicio interno de Kubernetes
service:
  name: mi-app-backend-service
  type: ClusterIP
  port: 80
  targetPort: 8080

# Metadatos de red para conexión a la Base de Datos
configMapData:
  DATABASE_ENDPOINT: "database.cf4acwm6m1ht.eu-south-2.rds.amazonaws.com"
  DATABASE_PORT: "5432"

# Inyección segura de credenciales mapeadas por Secrets Store CSI
envFromSecrets:
  - name: DATABASE_USER
    secretKeyRef:
      name: db-k8s-secret
      key: username
  - name: DATABASE_PASSWORD
    secretKeyRef:
      name: db-k8s-secret
      key: password

# Nombre o ARN del secreto en AWS Secrets Manager
secretsManager:
  objectName: "arn:aws:secretsmanager:eu-south-2:555968473487:secret:rds!db-9357b2fc-a475-4817-a1af-10c2d2e7090e-ZpStiK"