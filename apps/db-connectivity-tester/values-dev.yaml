# Configuración de réplicas
replicaCount: 1

namespace: dev
environment: dev

# Servicio interno de Kubernetes
service:
  name: mi-app-backend-service
  type: ClusterIP
  port: 80
  targetPort: 8080

# Metadatos de red para conexión a la Base de Datos
configMapData:
  DATABASE_ENDPOINT: "database.cf4acwm6m1ht.eu-south-2.rds.amazonaws.com"
  DATABASE_PORT: "5432"

# Inyección segura de credenciales mapeadas por Secrets Store CSI
envFromSecrets:
  - name: DATABASE_USER
    secretKeyRef:
      name: db-k8s-secret
      key: username
  - name: DATABASE_PASSWORD
    secretKeyRef:
      name: db-k8s-secret
      key: password