apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-connectivity-tester-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/rodorico83/argocd.git" # Reemplazar con URL de su repositorio Git
    targetRevision: HEAD
    path: "argocd/apps/charts/db-connectivity-tester"
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
