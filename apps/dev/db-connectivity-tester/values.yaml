# Configuración de réplicas
replicaCount: 1

namespace: db-connectivity-tester
environment: dev

# Servicio interno de Kubernetes
service:
  name: mi-app-backend-service
  type: ClusterIP
  port: 80
  targetPort: 8080

# Metadatos de red para conexión a la Base de Datos
configMapData:
  DATABASE_ENDPOINT: "database.cf4acwm6m1ht.eu-south-2.rds.amazonaws.com"
  DATABASE_PORT: "5432"

# Inyección segura de credenciales mapeadas por Secrets Store CSI
envFromSecrets:
  - name: DATABASE_USER
    secretKeyRef:
      name: db-k8s-secret
      key: username
  - name: DATABASE_PASSWORD
    secretKeyRef:
      name: db-k8s-secret
      key: password

# Nombre o ARN del secreto en AWS Secrets Manager
secretsManager:
  objectName: "arn:aws:secretsmanager:eu-south-2:555968473487:secret:rds!db-4a1e9251-1a2e-4f4d-a196-36abd8473b0f-4NNXdk"


s3Storage:
  enabled: true
  bucketName: "dev-app-uploads-eu-south-2"
  region: "eu-south-2"
  mountPath: "/mnt/s3-storage"   # Si se monta como volumen
  # Rol IAM específico de esta aplicación (IRSA)
  roleArn: "arn:aws:iam::123456789012:role/dev-app-s3-access-role"

serviceAccount:
  name: "db-connectivity-tester"