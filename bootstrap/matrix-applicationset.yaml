apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
              revision: HEAD
              files:
                - path: "apps/*/*/metadata.yaml"
          - clusters:
              selector:
                matchLabels:
                  provider: '{{.targetSite}}'
                  environment: '{{.targetEnv}}'
  template:
    metadata:
      name: '{{.targetEnv}}-{{.targetSite}}-{{.chartPath | base}}'
      #{{- if ne .targetEnv "production" }} Not working parsing error ; test with kubectl apply -f bootstrap/matrix-applicationset.yaml --dry-run=client
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      #{{- end }}
    spec:
      #project: default
      project: '{{.chartPath | base}}'
      sources:
        - repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
          targetRevision: '{{.chartVersion}}'
          path: '{{.chartPath}}'
          helm:
            ignoreMissingValueFiles: false
            valueFiles:
              - '$values/apps/{{.chartPath | base}}/{{.targetEnv}}/values.yaml'
              - '$values/apps/{{.chartPath | base}}/{{.targetEnv}}/values-{{.targetSite}}.yaml'

        - repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
          targetRevision: '{{.chartVersion}}'
          ref: values

      destination:
        name: '{{.name}}'
        namespace:  '{{.chartPath | base}}'

      # Ignore differencies in replicas, avoid collision with HPA modification no this field causing Argo Out-Of-Sync
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: argoproj.io
        kind: Rollout
        jsonPointers:
          - /spec/replicas

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 4 # Maneja caídas temporales de la API de Kubernetes durante el despliegue
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=true