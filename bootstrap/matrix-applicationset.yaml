apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
              revision: HEAD
              files:
                - path: "apps/*/metadata-*.yaml"
          - clusters:
              selector:
                matchLabels:
                  provider: '{{.targetSite}}'
                  environment: '{{.targetEnv}}'
  template:
    metadata:
      name: '{{.targetEnv}}-{{.targetSite}}-{{.chartPath | base}}'
      #{{- if ne .targetEnv "production" }} Not working parsing error ; test with kubectl apply -f bootstrap/matrix-applicationset.yaml --dry-run=client
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      #{{- end }}
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
          targetRevision: '{{.chartVersion}}'
          path: '{{.chartPath}}'

        - repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
          targetRevision: '{{.chartVersion}}'
          ref: values
          helm:
            ignoreMissingValueFiles: false
            valueFiles:
              - '$values/apps/{{.chartPath | base}}/values-{{.targetEnv}}.yaml'
              - '$values/apps/{{.chartPath | base}}/values-{{.targetEnv}}-{{.targetSite}}.yaml'

      destination:
        name: '{{.name}}'
        namespace: '{{.targetEnv}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true