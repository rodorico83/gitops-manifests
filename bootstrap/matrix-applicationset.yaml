apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
              revision: HEAD
              files:
                - path: "apps/*/metadata-*.yaml"
          - clusters:
              selector:
                matchLabels:
                  site: '{{.targetSite}}'
                  env: '{{.targetEnv}}'
  template:
    metadata:
      name: '{{.targetEnv}}-{{.targetSite}}-{{index .path.pathParam 1}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
          targetRevision: '{{.chartVersion}}'
          path: '{{.chartPath}}'

        - repoURL: 'https://github.com/rodorico83/gitops-manifests.git'
          targetRevision: HEAD
          ref: values
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/apps/{{index .path.pathParam 1}}/values-{{.targetEnv}}.yaml'
              - '$values/apps/{{index .path.pathParam 1}}/values-infra-{{.targetEnv}}-{{.targetSite}}.yaml'

      destination:
        name: '{{.name}}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true